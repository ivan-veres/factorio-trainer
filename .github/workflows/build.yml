# Builds both tools with MSVC at /W4, warnings as errors. A v* tag also publishes a GitHub release
# with the two exes attached and that version's CHANGELOG.md section as its notes.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          cl /nologo /std:c++20 /O2 /EHsc /W4 /WX /utf-8 trainer.cpp /Fe:factorio-trainer.exe dbghelp.lib user32.lib || exit /b 1
          cl /nologo /std:c++20 /O2 /EHsc /W4 /WX /utf-8 pdbq.cpp /Fe:pdbq.exe dbghelp.lib || exit /b 1

      - uses: actions/upload-artifact@v7
        with:
          name: factorio-trainer
          path: |
            factorio-trainer.exe
            pdbq.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this version's section of CHANGELOG.md; a tag without one fails here.
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]")==1 {on=1; next} /^## \[/ {on=0} /^\[[0-9]/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" factorio-trainer.exe pdbq.exe --title "$GITHUB_REF_NAME" --notes-file notes.md
